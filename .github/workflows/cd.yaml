name: CD - Build, Push and Deploy

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository }}

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: backend/requirements.txt

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Run backend tests
      run: pytest

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'pnpm'
        cache-dependency-path: frontend/pnpm-lock.yaml

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run frontend tests
      run: pnpm test

  build-and-push:
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push backend image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        file: ./backend/Dockerfile
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-backend:latest
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-backend:${{ github.sha }}

    - name: Build and push frontend image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        push: true
        build-args: |
          VITE_BACKEND_URL=${{ vars.VITE_BACKEND_URL || 'http://localhost:8000' }}
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-frontend:latest
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-frontend:${{ github.sha }}

    - name: Deploy DEV via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: 66.7.119.183
        username: scaiocesar
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          cd /opt/docrelief-docker
          IMAGE_TAG=${{ github.sha }} docker compose pull
          IMAGE_TAG=${{ github.sha }} docker compose up -d --remove-orphans
